name: Build Mission-Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with pinned libnx
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e HOME=/tmp devkitpro/devkita64:latest bash -lc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              make -C lib/libnx -j"$(nproc)"
              make -C lib/libnx install
              make dist -j"$(nproc)"
            '
      - name: Verify package
        run: |
          python3 scripts/verify-package.py dist/MissionControl-0.16.1.zip
          cd dist
          sha256sum MissionControl-0.16.1.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MissionControl-0.16.1
          path: |
            dist/MissionControl-0.16.1.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
