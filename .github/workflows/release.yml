name: Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mission-control-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish one package per application version
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install libjpeg-turbo (libstratosphere dep)
        run: dkp-pacman -S --noconfirm --needed switch-libjpeg-turbo

      - name: Resolve application version and target release
        id: version
        run: |
          set -euo pipefail

          APP_VERSION=$(sed -nE 's/^[[:space:]]*APP_VERSION[[:space:]]*:=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Makefile | head -1)
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::APP_VERSION in Makefile must use MAJOR.MINOR.PATCH format."
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the version release already exists
        id: release_lookup
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setOutput('exists', 'true');
              core.info(`Existing release ${process.env.RELEASE_TAG} will be refreshed.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
              core.info(`No release for ${process.env.RELEASE_TAG}; a new tag and release will be created.`);
            }

      - name: Build distribution package
        run: make dist -j"$(nproc)"

      - name: Locate the package and build release notes
        id: package
        run: |
          set -euo pipefail

          ZIP=$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [[ -z "$ZIP" ]]; then
            echo "::error::No ZIP package was produced in dist/."
            exit 1
          fi

          mkdir -p release
          cp "$ZIP" release/MissionControl.zip
          ZIP=release/MissionControl.zip
          SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          TAG="${{ steps.version.outputs.tag }}"
          TAG_NO_V="${TAG#v}"
          CHANGELOG=$(awk -v tag="$TAG_NO_V" '
            $0 ~ "^## \\[" tag "\\]" { section=1; next }
            section && /^## \[/ { exit }
            section { print }
          ' CHANGELOG.md)
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="Автоматическая сборка. Полное описание изменений приведено в CHANGELOG.md."
          fi

          NOTES_FILE=release-notes.md
          {
            echo "$CHANGELOG"
            echo
            echo '---'
            echo
            echo "**SHA-256:** \`$SHA256\`"
            echo "**Собрано из коммита:** \`${GITHUB_SHA::7}\`"
            echo "**Артефакт в релизе:** один ZIP-пакет."
          } > "$NOTES_FILE"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create a new version tag when needed
        if: steps.release_lookup.outputs.exists == 'false'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name 'Dimasick-git'
            git config user.email 'dimaorynchukk@gmail.com'
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create or refresh the release package
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mission-Control ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.package.outputs.notes_path }}
          files: ${{ steps.package.outputs.zip }}
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only the current ZIP package in the release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          KEEP_ASSET: ${{ steps.package.outputs.name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });

            const staleAssets = release.data.assets.filter(
              (asset) => asset.name !== process.env.KEEP_ASSET,
            );
            for (const asset of staleAssets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
              core.info(`Deleted stale release asset: ${asset.name}`);
            }

            const remaining = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
            });
            if (remaining.data.length !== 1 || remaining.data[0].name !== process.env.KEEP_ASSET) {
              throw new Error('Release must contain exactly one current ZIP package after cleanup.');
            }
