name: Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mission-control-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish one package per application version
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install libjpeg-turbo (libstratosphere dep)
        run: dkp-pacman -S --noconfirm --needed switch-libjpeg-turbo

      - name: Resolve application version and target release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APP_VERSION=$(sed -nE 's/^[[:space:]]*APP_VERSION[[:space:]]*:=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Makefile | head -1)
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::APP_VERSION in Makefile must use MAJOR.MINOR.PATCH format."
            exit 1
          fi

          TAG="v${APP_VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            echo "Existing release $TAG will be refreshed."
          else
            RELEASE_EXISTS=false
            echo "No release for $TAG exists; a new tag and release will be created."
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Build distribution package
        run: make dist -j"$(nproc)"

      - name: Locate the package and build release notes
        id: package
        run: |
          set -euo pipefail

          ZIP=$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [[ -z "$ZIP" ]]; then
            echo "::error::No ZIP package was produced in dist/."
            exit 1
          fi

          SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          TAG="${{ steps.version.outputs.tag }}"
          TAG_NO_V="${TAG#v}"
          CHANGELOG=$(awk -v tag="$TAG_NO_V" '
            $0 ~ "^## \\[" tag "\\]" { section=1; next }
            section && /^## \[/ { exit }
            section { print }
          ' CHANGELOG.md)
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="Автоматическая сборка. Полное описание изменений приведено в CHANGELOG.md."
          fi

          {
            echo 'notes<<EOF'
            echo "$CHANGELOG"
            echo
            echo '---'
            echo
            echo "**SHA-256:** \`$SHA256\`"
            echo "**Собрано из коммита:** \`${GITHUB_SHA::7}\`"
            echo "**Артефакт в релизе:** один ZIP-пакет."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Create a new version tag when needed
        if: steps.version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name 'Dimasick-git'
            git config user.email 'dimaorynchukk@gmail.com'
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create a new release for a new application version
        if: steps.version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.package.outputs.zip }}" \
            --repo "${{ github.repository }}" \
            --title "Mission-Control ${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.package.outputs.notes }}"

      - name: Replace the package in the existing release
        if: steps.version.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          NEW_ASSET="${{ steps.package.outputs.name }}"

          # Upload first: a failed upload must never leave an existing release empty.
          gh release upload "$TAG" "${{ steps.package.outputs.zip }}" \
            --repo "${{ github.repository }}" --clobber

          # Then delete every older asset, including obsolete ZIPs and checksum files.
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' \
            | while IFS= read -r asset; do
                [[ -z "$asset" || "$asset" == "$NEW_ASSET" ]] && continue
                gh release delete-asset "$TAG" "$asset" --repo "${{ github.repository }}" --yes
              done

          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Mission-Control $TAG" \
            --notes "${{ steps.package.outputs.notes }}"
